<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>打卡</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--sub:#94a3b8;--green:#22c55e;--red:#ef4444;--line:#334155}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;padding:env(safe-area-inset-top) 16px 40px}
.wrap{max-width:480px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
header h1{font-size:20px;margin:0}
.sub{color:var(--sub);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
.link{background:none;border:0;color:var(--sub);font-size:13px;text-decoration:underline}
.punch{text-align:center;padding:4px 0 24px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid transparent;border-radius:999px;padding:8px 14px;font-size:15px}
.chip.sel{border-color:var(--c)}
.chip.locked{opacity:.45}
.chip.locked.sel{opacity:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.status{font-size:15px;color:var(--sub);margin-bottom:6px;min-height:22px}
.timer{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:18px;min-height:54px}
#btn{width:220px;height:220px;border-radius:50%;border:0;font-size:36px;font-weight:700;color:#fff;background:var(--green);box-shadow:0 10px 40px rgba(34,197,94,.35);transition:transform .1s,background .2s}
#btn.out{background:var(--red);box-shadow:0 10px 40px rgba(239,68,68,.35)}
#btn:active{transform:scale(.95)}
#btn:disabled{opacity:.4}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px}
.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.month-nav button{background:var(--bg);border:0;width:36px;height:36px;border-radius:10px;font-size:18px}
.month-nav b{font-size:17px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--bg);border-radius:12px;padding:12px}
.stat .n{font-size:22px;font-weight:700;margin-top:4px}
.stat.wide{grid-column:span 2}
.stat.wide .n{font-size:30px;color:var(--green)}
.brk{margin-top:12px}
.brk-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.brk-row .nm{flex:1}
.brk-row .hr{color:var(--sub);font-size:13px}
.brk-row .pay{font-weight:600;min-width:72px;text-align:right}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
h2{font-size:15px;margin:0;color:var(--sub);font-weight:600}
.add{background:var(--bg);border:0;border-radius:10px;padding:6px 12px;font-size:13px;color:var(--text)}
.job{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.job:first-of-type{border-top:0}
.job .nm{flex:1}
.job .w{color:var(--sub);font-size:13px}
.rec{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.rec .d{font-size:15px;display:flex;align-items:center;gap:6px}
.rec .t{font-size:12px;color:var(--sub);margin-top:2px}
.rec .h{font-weight:600;margin-right:6px;text-align:right}
.x{background:none;border:0;color:var(--sub);font-size:17px;padding:4px 8px}
.empty{color:var(--sub);text-align:center;padding:16px 0;font-size:14px}
#login{text-align:center;padding:80px 0}
#login button{background:#fff;color:#111;border:0;border-radius:12px;padding:14px 24px;font-size:16px;font-weight:600}
.badge{font-size:12px;background:var(--card);border-radius:8px;padding:4px 8px;color:var(--sub)}
.hidden{display:none}
dialog{background:var(--card);color:var(--text);border:0;border-radius:16px;padding:20px;width:min(340px,90vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 14px;font-size:17px}
dialog label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
dialog input,dialog select{width:100%;min-height:42px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:16px}
.colors{display:flex;gap:10px;margin-top:4px}
.colors i{width:28px;height:28px;border-radius:50%;border:3px solid transparent;background:var(--c);cursor:pointer}
.colors i.sel{border-color:#fff}
.dlg-btns{display:flex;gap:8px;margin-top:18px}
.dlg-btns button{flex:1;border:0;border-radius:10px;padding:11px;font-size:15px;background:var(--bg)}
.dlg-btns .ok{background:var(--green);color:#fff;font-weight:600}
.dlg-btns .del{background:none;color:var(--red);flex:none;padding:11px 8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⏱ 打卡</h1>
    <div><span id="mode" class="badge"></span> <button class="link hidden" id="logout">登出</button></div>
  </header>

  <div id="login" class="hidden">
    <p class="sub" style="margin-bottom:20px">登入後，手機與電腦的打卡紀錄會自動同步</p>
    <button id="loginBtn">使用 Google 登入</button>
  </div>

  <div id="app" class="hidden">
    <section class="punch">
      <div class="chips" id="chips"></div>
      <div class="status" id="status"></div>
      <div class="timer" id="timer"></div>
      <button id="btn">上班</button>
      <div style="margin-top:14px"><button class="link" id="manual">忘記打卡？手動補登時間</button></div>
    </section>

    <section class="card">
      <div class="month-nav">
        <button id="prev">‹</button><b id="monthLabel"></b><button id="next">›</button>
      </div>
      <div class="stats">
        <div class="stat"><div class="sub">本月工時</div><div class="n" id="mHours">0</div></div>
        <div class="stat"><div class="sub">出勤天數</div><div class="n" id="mDays">0</div></div>
        <div class="stat wide"><div class="sub">預估薪資（全部工作）</div><div class="n" id="mPay">NT$ 0</div></div>
      </div>
      <div class="brk" id="brk"></div>
    </section>

    <section class="card">
      <div class="card-h"><h2>我的工作</h2><button class="add" id="addJob">＋ 新增工作</button></div>
      <div id="jobs"></div>
    </section>

    <section class="card">
      <div class="card-h"><h2>打卡紀錄</h2><button class="add" id="addRec">＋ 補登紀錄</button></div>
      <div id="list"></div>
    </section>
  </div>
</div>

<dialog id="dlg">
  <h3 id="dlgTitle">新增工作</h3>
  <label>工作名稱</label>
  <input id="jName" placeholder="例如：便利商店" maxlength="20">
  <label>時薪 NT$</label>
  <input id="jWage" type="number" inputmode="decimal" min="0" step="1" placeholder="例如 190">
  <label>顏色</label>
  <div class="colors" id="jColors"></div>
  <div class="dlg-btns">
    <button class="del hidden" id="jDel">刪除</button>
    <button id="jCancel">取消</button>
    <button class="ok" id="jSave">儲存</button>
  </div>
</dialog>

<dialog id="recDlg">
  <h3 id="recTitle">補登紀錄</h3>
  <label>工作</label>
  <select id="rJob"></select>
  <label>開始時間</label>
  <input id="rStart" type="datetime-local">
  <label>結束時間（留空 = 還在上班中）</label>
  <input id="rEnd" type="datetime-local">
  <div class="dlg-btns">
    <button id="rCancel">取消</button>
    <button class="ok" id="rSave">儲存</button>
  </div>
</dialog>

<script type="module">
// ====== 填入你的 Firebase 設定（Firebase 控制台 → 專案設定 → 你的應用程式）======
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  appId: "YOUR_APP_ID"
};
// =================================================================================

const CLOUD = !String(firebaseConfig.apiKey).startsWith("YOUR_");
const $ = id => document.getElementById(id);
const PALETTE = ["#22c55e", "#3b82f6", "#f59e0b", "#ec4899", "#a855f7", "#14b8a6"];
let records = [], jobs = [], busy = false;
let selJob = localStorage.getItem("pc_lastJob") || "";
let view = new Date(); view.setDate(1);

// ---------- 儲存層 ----------
let store;
if (CLOUD) {
  const V = "10.12.2";
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app = initializeApp(firebaseConfig);
  const auth = A.getAuth(app);
  const db = F.getFirestore(app);
  let uid = null, unsubs = [];
  const col = n => F.collection(db, "users", uid, n);
  store = {
    init(onReady) {
      $("loginBtn").onclick = () => A.signInWithPopup(auth, new A.GoogleAuthProvider()).catch(e => alert("登入失敗：" + e.message));
      $("logout").onclick = () => A.signOut(auth);
      A.onAuthStateChanged(auth, user => {
        unsubs.forEach(u => u()); unsubs = [];
        if (!user) { uid = null; records = []; jobs = []; $("login").classList.remove("hidden"); $("app").classList.add("hidden"); $("logout").classList.add("hidden"); return; }
        uid = user.uid;
        $("login").classList.add("hidden"); $("app").classList.remove("hidden"); $("logout").classList.remove("hidden");
        unsubs.push(F.onSnapshot(F.query(col("records"), F.orderBy("start", "desc"), F.limit(1000)), snap => {
          records = snap.docs.map(d => ({ id: d.id, ...d.data() })); onReady();
        }));
        unsubs.push(F.onSnapshot(col("jobs"), snap => {
          jobs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0));
          onReady();
        }));
      });
    },
    start: jobId => F.addDoc(col("records"), { start: Date.now(), end: null, jobId }),
    end: id => F.updateDoc(F.doc(db, "users", uid, "records", id), { end: Date.now() }),
    removeRecord: id => F.deleteDoc(F.doc(db, "users", uid, "records", id)),
    addRecord: r => F.addDoc(col("records"), { start: r.start, end: r.end, jobId: r.jobId }),
    updateRecord: (id, r) => F.updateDoc(F.doc(db, "users", uid, "records", id), { start: r.start, end: r.end, jobId: r.jobId }),
    async saveJob(j) {
      const data = { name: j.name, wage: j.wage, color: j.color };
      if (j.id) return F.setDoc(F.doc(db, "users", uid, "jobs", j.id), data, { merge: true });
      return F.addDoc(col("jobs"), { ...data, order: Date.now() });
    },
    async removeJob(id) {
      const snap = await F.getDocs(F.query(col("records"), F.where("jobId", "==", id)));
      for (let i = 0; i < snap.docs.length; i += 400) {
        const b = F.writeBatch(db);
        snap.docs.slice(i, i + 400).forEach(d => b.delete(d.ref));
        await b.commit();
      }
      await F.deleteDoc(F.doc(db, "users", uid, "jobs", id));
    }
  };
} else {
  const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const saveR = () => localStorage.setItem("pc_records", JSON.stringify(records));
  const saveJ = () => localStorage.setItem("pc_jobs", JSON.stringify(jobs));
  store = {
    init(onReady) {
      records = load("pc_records") || [];
      jobs = load("pc_jobs") || [];
      $("app").classList.remove("hidden");
      onReady();
    },
    async start(jobId) { records.unshift({ id: String(Date.now()), start: Date.now(), end: null, jobId }); saveR(); render(); },
    async end(id) { records.find(r => r.id === id).end = Date.now(); saveR(); render(); },
    async removeRecord(id) { records = records.filter(r => r.id !== id); saveR(); render(); },
    async addRecord(r) { records.push({ id: String(Date.now()), start: r.start, end: r.end, jobId: r.jobId }); records.sort((a, b) => b.start - a.start); saveR(); render(); },
    async updateRecord(id, r) { Object.assign(records.find(x => x.id === id), { start: r.start, end: r.end, jobId: r.jobId }); records.sort((a, b) => b.start - a.start); saveR(); render(); },
    async saveJob(j) {
      if (j.id) Object.assign(jobs.find(x => x.id === j.id), { name: j.name, wage: j.wage, color: j.color });
      else jobs.push({ id: String(Date.now()), name: j.name, wage: j.wage, color: j.color });
      saveJ(); render();
    },
    async removeJob(id) {
      jobs = jobs.filter(j => j.id !== id); records = records.filter(r => r.jobId !== id);
      saveJ(); saveR(); render();
    }
  };
}
$("mode").textContent = CLOUD ? "☁️ 雲端同步" : "💾 本機模式";

// ---------- 工具 ----------
const pad = n => String(n).padStart(2, "0");
const fmtClock = ms => { const s = Math.floor(ms / 1000); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; };
const fmtHM = ms => { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)} 小時 ${m % 60} 分` : `${m} 分`; };
const fmtTime = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const money = n => "NT$ " + Math.round(n).toLocaleString();
const dur = r => (r.end || Date.now()) - r.start;
const inView = r => { const d = new Date(r.start); return d.getFullYear() === view.getFullYear() && d.getMonth() === view.getMonth(); };
const jobOf = r => jobs.find(j => j.id === r.jobId) || jobs[0];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const WD = "日一二三四五六";
const currentJob = () => jobs.find(j => j.id === selJob) || jobs[0];

// ---------- 畫面 ----------
function renderPunch() {
  const open = records.find(r => !r.end);
  const btn = $("btn");
  if (!jobs.length) {
    $("chips").innerHTML = "";
    $("status").textContent = "請先在下方新增一份工作";
    btn.textContent = "上班"; btn.className = ""; btn.disabled = true;
    return;
  }
  const active = open ? jobOf(open) : currentJob();
  $("chips").innerHTML = jobs.map(j =>
    `<button class="chip${j.id === active.id ? " sel" : ""}${open ? " locked" : ""}" style="--c:${j.color}" data-job="${j.id}"><span class="dot" style="--c:${j.color}"></span>${esc(j.name)}</button>`
  ).join("");
  btn.textContent = open ? "下班" : "上班";
  btn.className = open ? "out" : "";
  btn.disabled = busy;
  $("status").textContent = open ? `${active.name}・${fmtTime(open.start)} 開始` : `選擇工作後按「上班」`;
  tick();
}
function renderStats() {
  $("monthLabel").textContent = `${view.getFullYear()} 年 ${view.getMonth() + 1} 月`;
  const mine = records.filter(inView);
  const by = new Map();
  let total = 0, pay = 0;
  mine.forEach(r => {
    const j = jobOf(r); if (!j) return;
    const ms = dur(r), p = ms / 3600000 * (j.wage || 0);
    const e = by.get(j.id) || { j, ms: 0, pay: 0 };
    e.ms += ms; e.pay += p; by.set(j.id, e);
    total += ms; pay += p;
  });
  const days = new Set(mine.map(r => new Date(r.start).toDateString())).size;
  $("mHours").textContent = fmtHM(total);
  $("mDays").textContent = `${days} 天`;
  $("mPay").textContent = money(pay);
  $("brk").innerHTML = [...by.values()].map(e =>
    `<div class="brk-row"><span class="dot" style="--c:${e.j.color}"></span><span class="nm">${esc(e.j.name)}</span><span class="hr">${fmtHM(e.ms)}</span><span class="pay">${money(e.pay)}</span></div>`
  ).join("");
}
function renderJobs() {
  $("jobs").innerHTML = jobs.length ? jobs.map(j =>
    `<div class="job"><span class="dot" style="--c:${j.color}"></span><span class="nm">${esc(j.name)}</span><span class="w">時薪 ${money(j.wage || 0)}</span><button class="x" data-edit="${j.id}" aria-label="編輯">✏️</button></div>`
  ).join("") : `<div class="empty">還沒有工作，先新增一份吧</div>`;
}
function renderList() {
  const mine = records.filter(inView);
  $("list").innerHTML = mine.length ? mine.map(r => {
    const d = new Date(r.start), j = jobOf(r);
    return `<div class="rec"><div><div class="d"><span class="dot" style="--c:${j ? j.color : "#64748b"}"></span>${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）${j ? esc(j.name) : ""}</div>
      <div class="t">${fmtTime(r.start)} – ${r.end ? fmtTime(r.end) : "進行中"}</div></div>
      <div style="display:flex;align-items:center"><span class="h">${fmtHM(dur(r))}</span>
      <button class="x" data-edit-rec="${r.id}" aria-label="修改時間">✏️</button>
      <button class="x" data-del="${r.id}" aria-label="刪除">🗑</button></div></div>`;
  }).join("") : `<div class="empty">這個月還沒有紀錄</div>`;
}
function render() { renderPunch(); renderStats(); renderJobs(); renderList(); }
function tick() {
  const open = records.find(r => !r.end);
  $("timer").textContent = open ? fmtClock(Date.now() - open.start) : "";
}

// ---------- 事件 ----------
$("chips").onclick = e => {
  const b = e.target.closest("[data-job]");
  if (!b || records.some(r => !r.end)) return;
  selJob = b.dataset.job; localStorage.setItem("pc_lastJob", selJob); renderPunch();
};
$("btn").onclick = async () => {
  if (busy) return; busy = true; renderPunch();
  try {
    const open = records.find(r => !r.end);
    if (open) await store.end(open.id); else await store.start(currentJob().id);
    if (navigator.vibrate) navigator.vibrate(60);
  } catch (e) { alert("打卡失敗：" + e.message); }
  busy = false; render();
};
$("list").onclick = async e => {
  const id = e.target.dataset.del;
  if (id && confirm("確定刪除這筆紀錄？")) await store.removeRecord(id);
  const eid = e.target.dataset.editRec;
  if (eid) openRec(records.find(r => r.id === eid));
};

// ---- 補登 / 修改紀錄視窗 ----
let editingRec = null;
const toInput = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function openRec(rec) {
  if (!jobs.length) return alert("請先新增一份工作");
  editingRec = rec || null;
  $("recTitle").textContent = rec ? "修改紀錄" : "補登紀錄";
  $("rJob").innerHTML = jobs.map(j => `<option value="${j.id}">${esc(j.name)}</option>`).join("");
  const j = rec ? jobOf(rec) : currentJob();
  $("rJob").value = j.id;
  $("rStart").value = toInput(rec ? rec.start : Date.now());
  $("rEnd").value = rec ? (rec.end ? toInput(rec.end) : "") : toInput(Date.now());
  $("recDlg").showModal();
}
$("manual").onclick = () => openRec(null);
$("addRec").onclick = () => openRec(null);
$("rCancel").onclick = () => $("recDlg").close();
$("rSave").onclick = async () => {
  const start = new Date($("rStart").value).getTime();
  const end = $("rEnd").value ? new Date($("rEnd").value).getTime() : null;
  if (!start) return alert("請選擇開始時間");
  if (start > Date.now() + 60000) return alert("開始時間不能是未來");
  if (end && end <= start) return alert("結束時間要晚於開始時間");
  if (!end && records.some(r => !r.end && (!editingRec || r.id !== editingRec.id))) return alert("目前已有一筆上班中的紀錄，請先下班，或填入結束時間");
  const data = { start, end, jobId: $("rJob").value };
  try {
    if (editingRec) await store.updateRecord(editingRec.id, data); else await store.addRecord(data);
    if (!end) { selJob = data.jobId; localStorage.setItem("pc_lastJob", selJob); }
    $("recDlg").close();
  } catch (e) { alert("儲存失敗：" + e.message); }
};
$("prev").onclick = () => { view.setMonth(view.getMonth() - 1); renderStats(); renderList(); };
$("next").onclick = () => { view.setMonth(view.getMonth() + 1); renderStats(); renderList(); };

// ---- 工作編輯視窗 ----
let editing = null, pickedColor = PALETTE[0];
function drawColors() {
  $("jColors").innerHTML = PALETTE.map(c => `<i style="--c:${c}" data-c="${c}" class="${c === pickedColor ? "sel" : ""}"></i>`).join("");
}
function openDlg(job) {
  editing = job || null;
  $("dlgTitle").textContent = job ? "編輯工作" : "新增工作";
  $("jName").value = job ? job.name : "";
  $("jWage").value = job ? job.wage : "";
  pickedColor = job ? job.color : PALETTE[jobs.length % PALETTE.length];
  $("jDel").classList.toggle("hidden", !job);
  drawColors(); $("dlg").showModal();
}
$("addJob").onclick = () => openDlg(null);
$("jobs").onclick = e => { const id = e.target.dataset.edit; if (id) openDlg(jobs.find(j => j.id === id)); };
$("jColors").onclick = e => { if (e.target.dataset.c) { pickedColor = e.target.dataset.c; drawColors(); } };
$("jCancel").onclick = () => $("dlg").close();
$("jSave").onclick = async () => {
  const name = $("jName").value.trim();
  const wage = parseFloat($("jWage").value);
  if (!name) return alert("請輸入工作名稱");
  if (!(wage >= 0)) return alert("請輸入時薪");
  try { await store.saveJob({ id: editing && editing.id, name, wage, color: pickedColor }); $("dlg").close(); }
  catch (e) { alert("儲存失敗：" + e.message); }
};
$("jDel").onclick = async () => {
  const n = records.filter(r => r.jobId === editing.id).length;
  if (!confirm(`刪除「${editing.name}」？${n ? `\n這份工作的 ${n} 筆打卡紀錄也會一併刪除，無法復原。` : ""}`)) return;
  try { await store.removeJob(editing.id); $("dlg").close(); } catch (e) { alert("刪除失敗：" + e.message); }
};

setInterval(() => { tick(); if (records.some(r => !r.end)) renderStats(); }, 1000);
store.init(render);
</script>
</body>
</html>
